<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
</head>
<body>

<div id="marker-filters" style="margin-bottom:8px;">
    ${filter_controls_html}
</div>

<div id="kakao-map" style="width:100%;height:${height}px;"></div>

<script
    type="text/javascript"
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=${app_key}&autoload=false">
</script>

<script>
(function () {
    function renderMap() {
        if (typeof kakao === "undefined" || !kakao.maps) {
            console.error("Kakao Maps SDK load failed.");

            var el = document.getElementById("kakao-map");

            if (el) {
                el.innerHTML =
                    '<div style="padding:20px;color:#d32f2f;background:#ffebee;border-radius:4px;">' +
                    'Kakao 지도 SDK를 로드하지 못했습니다.' +
                    '</div>';
            }

            return;
        }

        console.log("Kakao Maps SDK loaded.");

        kakao.maps.load(function () {
            console.log("Kakao Maps load callback executed.");

            var container = document.getElementById("kakao-map");

            if (!container) {
                console.error("Kakao map container not found.");
                return;
            }

            var options = {
                center: new kakao.maps.LatLng(37.5665, 126.9780),
                level: 7
            };

            var map = new kakao.maps.Map(container, options);

            console.log("Kakao Map created.");

            var typeStyles = ${type_styles_json};
            var markersByType = ${markers_by_type_json};
            var streetLights = ${street_lights_json};

            var markerLayers = {};

            Object.keys(markersByType).forEach(function (type) {
                markerLayers[type] = markersByType[type].map(function (f) {
                    var marker = new kakao.maps.Marker({
                        position: new kakao.maps.LatLng(f.lat, f.lng),
                        title: f.name
                    });

                    marker.setMap(map);

                    return marker;
                });
            });

            var streetLightMarkers = streetLights.map(function (p) {
                return new kakao.maps.Marker({
                    position: new kakao.maps.LatLng(p.lat, p.lng)
                });
            });

            function toggleType(type, checked) {
                if (type === "가로등") {
                    streetLightMarkers.forEach(function (marker) {
                        marker.setMap(checked ? map : null);
                    });

                    return;
                }

                (markerLayers[type] || []).forEach(function (marker) {
                    marker.setMap(checked ? map : null);
                });
            }

            document
                .querySelectorAll("#marker-filters input[type=checkbox]")
                .forEach(function (checkbox) {

                    toggleType(
                        checkbox.value,
                        checkbox.checked
                    );

                    checkbox.addEventListener("change", function () {
                        toggleType(
                            checkbox.value,
                            checkbox.checked
                        );
                    });
                });

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function (pos) {
                        var loc = new kakao.maps.LatLng(
                            pos.coords.latitude,
                            pos.coords.longitude
                        );

                        new kakao.maps.Marker({
                            position: loc,
                            map: map,
                            title: "내 위치"
                        });

                        map.setCenter(loc);
                    },
                    function (error) {
                        console.warn(
                            "현재 위치를 가져오지 못했습니다.",
                            error
                        );
                    }
                );
            }
        });
    }

    /*
     * autoload=false이므로 SDK가 이미 로드된 뒤
     * kakao.maps.load()를 호출합니다.
     */
    if (typeof kakao !== "undefined" && kakao.maps) {
        renderMap();
    } else {
        console.error("Kakao Maps SDK object is not available.");
    }
})();
</script>

</body>
</html>
